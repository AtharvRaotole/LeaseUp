name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run lint
        run: pnpm lint

      - name: Check SUBMISSION.md and integration head
        run: node scripts/check-submission-doc.mjs

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build workspace packages first
        run: |
          pnpm --filter @leaseup/contracts build
          pnpm --filter @leaseup/fixtures build
          ls -la packages/contracts/dist/ packages/fixtures/dist/ || echo "Dist folders missing!"
      
      - name: Build all packages
        env:
          VITE_API_URL: https://ci.leaseup.invalid
        run: pnpm build
        
      - name: Run typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run tests
        run: pnpm test

  worker-bundle:
    name: Worker bundle (wrangler dry-run)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build worker dependencies
        run: |
          pnpm --filter @leaseup/contracts build
          pnpm --filter @leaseup/fixtures build
          pnpm --filter @leaseup/worker build
      - name: Wrangler deploy dry-run
        run: pnpm --filter @leaseup/worker exec wrangler deploy --dry-run --outdir dist-dry

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, worker-bundle]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build
        env:
          VITE_API_URL: https://ci.leaseup.invalid
        run: pnpm build
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/web/dist
            apps/worker/dist
          retention-days: 7

  csp-e2e:
    name: CSP report e2e
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: CSP + map smoke (production _headers)
        run: node scripts/run-csp-e2e.mjs

  a11y-e2e:
    name: Axe a11y e2e
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Axe serious/critical (production preview + demo worker)
        run: node scripts/run-a11y-e2e.mjs

  qloo-down-e2e:
    name: Qloo down e2e
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Chain-size fallback when Qloo is down
        run: node scripts/run-qloo-down-e2e.mjs

  watchlist-e2e:
    name: Watchlist e2e
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Watchlist save and recheck (demo fixtures)
        run: node scripts/run-watchlist-e2e.mjs

  qloo-ranking-toggle-e2e:
    name: Qloo ranking toggle e2e
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Taste vs chain-size toggle on Wicker demo
        run: node scripts/run-qloo-ranking-toggle-e2e.mjs

  wicker-broker-e2e:
    name: Wicker broker report e2e
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Who shops here + Who to contact on Wicker demo
        run: node scripts/run-wicker-broker-e2e.mjs

  pipeline-crm-e2e:
    name: Pipeline CRM e2e
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Pipeline status, notes, and reminder (demo)
        run: node scripts/run-pipeline-crm-e2e.mjs

  pipeline-loop-e2e:
    name: Pipeline loop e2e
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Report, watchlist, and pipeline evidence loop
        run: node scripts/run-pipeline-loop-e2e.mjs

  vacancy-above-fold-e2e:
    name: Vacancy above fold e2e
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Vacancy estimate near pitch list
        run: node scripts/run-vacancy-above-fold-e2e.mjs

  demo-pitch-smoke-e2e:
    name: Demo pitch smoke e2e
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Stable demo pitch share link (/pitch/demo-boulder-ulta)
        run: node scripts/run-demo-pitch-smoke-e2e.mjs

  landing-hero-preview-e2e:
    name: Landing hero preview e2e
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Hero preview image loads (light + dark)
        run: node scripts/run-landing-hero-preview-e2e.mjs

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [build]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Lighthouse CI (preview + demo worker)
        continue-on-error: true
        run: node scripts/run-lighthouse-ci.mjs || true
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 14
